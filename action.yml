name: PR traceability
description: Require a Jira reference in a PR title or source branch, with bot, ServiceNow incident/request, and label exemptions.
branding:
  icon: link
  color: blue
inputs:
  project-keys:
    description: Optional comma-separated uppercase Jira project keys (e.g. TEAM,OPS). At least one reference must match an allowed project. Empty allows any project.
    required: false
  jira-secret:
    description: Optional Jira Cloud JSON credentials containing email and apiToken. Enables issue validation and repository components when enabled.
    required: false
  jira-url:
    description: Jira Cloud HTTPS base URL. Required with jira-secret unless its JSON contains baseUrl. Uses REST API v3.
    required: false
  jira-remote-links:
    description: Set to true to create PR remote links on validated referenced issues when the PR opens. Requires Jira credentials.
    required: false
    default: 'false'
  jira-components:
    description: Set to false to disable creating and assigning the org/repo Jira component on PR open. Requires Jira credentials; enabled by default.
    required: false
    default: 'true'
outputs:
  result:
    description: passed, or skipped when the PR author is a bot.
    value: ${{ steps.traceability.outputs.result }}
  jira-references:
    description: JSON array of distinct matching Jira references, filtered by project-keys when supplied; empty for exemptions.
    value: ${{ steps.traceability.outputs.jira-references }}
runs:
  using: composite
  steps:
    - name: Check PR traceability
      id: traceability
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        INPUT_PROJECT-KEYS: ${{ inputs.project-keys }}
        INPUT_JIRA-SECRET: ${{ inputs.jira-secret }}
        INPUT_JIRA-URL: ${{ inputs.jira-url }}
        INPUT_JIRA-REMOTE-LINKS: ${{ inputs.jira-remote-links }}
        INPUT_JIRA-COMPONENTS: ${{ inputs.jira-components }}
        GOTOOLCHAIN: local
        GOWORK: 'off'
        GOPROXY: 'off'
        GOSUMDB: 'off'
      run: go run ./cmd/pr-traceability
